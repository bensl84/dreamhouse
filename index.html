<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dream House</title>
<style>
  :root{
    --pink:#ff5fa2; --pink-deep:#e63d86; --yellow:#ffd23f; --mint:#5fd6b4;
    --lav:#b79cff; --sky1:#ffe3f1; --sky2:#dcefff; --cream:#fff8f0;
    --ink:#5a3d52; --soft:#ffffffd9; --shadow:rgba(120,60,100,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'ui-rounded','SF Pro Rounded','Hiragino Maru Gothic ProN','Comic Sans MS','Chalkboard SE',sans-serif;
    background:linear-gradient(160deg,var(--sky1),var(--sky2));
    color:var(--ink); position:fixed; inset:0;
  }
  #app{position:absolute; inset:0; display:flex; flex-direction:column;}
  /* ---------- TOP BAR ---------- */
  #topbar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:max(10px,env(safe-area-inset-top)) 16px 8px; gap:10px; z-index:30;
  }
  #title{font-size:clamp(18px,4.5vw,26px); font-weight:800; color:var(--pink-deep);
    text-shadow:0 2px 0 #fff; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
  #title svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px var(--shadow));}
  .iconbtn{
    width:50px; height:50px; border:none; border-radius:50%;
    background:linear-gradient(#ffffff,#ffe9f3);
    box-shadow:0 5px 12px var(--shadow), inset 0 2px 2px #fff, inset 0 -3px 4px rgba(180,90,140,.18);
    font-size:24px; display:grid; place-items:center; cursor:pointer; transition:transform .12s ease;
  }
  .iconbtn:active{transform:scale(.88);}
  /* ---------- STAGE ---------- */
  #stage{flex:1 1 auto; position:relative; overflow:hidden; min-height:0;}
  .room{position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; transform:scale(.97) translateY(8px); pointer-events:none; transition:opacity .3s ease, transform .3s cubic-bezier(.2,.9,.3,1.2);}
  .room.active{opacity:1; transform:none; pointer-events:auto;}
  /* ---------- BOTTOM NAV ---------- */
  #nav{
    flex:0 0 auto; display:flex; gap:6px; padding:8px 8px max(8px,env(safe-area-inset-bottom));
    overflow-x:auto; background:var(--soft); box-shadow:0 -4px 16px var(--shadow);
    backdrop-filter:blur(8px); scrollbar-width:none;
  }
  #nav::-webkit-scrollbar{display:none;}
  .navbtn{
    flex:0 0 auto; width:60px; height:64px; border:none; border-radius:18px; background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; transition:transform .12s ease, background .2s; font-size:11px; font-weight:700;
    color:var(--ink);
  }
  .navbtn .e{width:30px;height:30px;display:block;}
  .navbtn .e svg{width:100%;height:100%;}
  .navbtn:active{transform:scale(.9);}
  .navbtn.on{background:#fff; box-shadow:0 4px 10px var(--shadow);}
  .navbtn.on .e{filter:drop-shadow(0 2px 3px var(--shadow));}
  /* ---------- GENERIC ROOM LAYOUT ---------- */
  .scene{flex:1 1 auto; position:relative; overflow:hidden; min-height:0;}
  .sceneBg{position:absolute;inset:0;width:100%;height:100%;}
  .sceneBg svg{position:absolute;inset:0;width:100%;height:100%;}
  .roomname{position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:linear-gradient(#fff,#fff0f7); padding:6px 20px; border-radius:30px; font-weight:800; font-size:16px;
    color:var(--pink-deep); box-shadow:0 6px 14px var(--shadow), inset 0 2px 2px #fff; z-index:5; white-space:nowrap;}
  .tray{flex:0 0 auto; background:linear-gradient(var(--cream),#fff3e6); padding:10px; display:flex; flex-direction:column;
    gap:8px; box-shadow:0 -4px 16px var(--shadow); max-height:42%; overflow-y:auto;}
  .tabrow{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;}
  .tabrow::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; padding:8px 14px; border:none; border-radius:16px; background:linear-gradient(#fff,#fdeef5);
    font-weight:700; font-size:14px; color:var(--ink); box-shadow:0 3px 7px var(--shadow), inset 0 1px 1px #fff;
    cursor:pointer; transition:transform .1s;}
  .tab.on{background:linear-gradient(#ff7db5,#ff4f97); color:#fff; box-shadow:0 4px 9px rgba(230,61,134,.4), inset 0 1px 1px #ffb8d8;}
  .tab:active{transform:scale(.92);}
  .swatches{display:flex; flex-wrap:wrap; gap:10px; padding-top:2px; align-content:flex-start;}
  .sw{width:54px; height:54px; border-radius:16px; border:3px solid #fff; cursor:pointer;
    box-shadow:0 4px 9px var(--shadow), inset 0 2px 3px rgba(255,255,255,.5); display:grid; place-items:center; font-size:26px;
    transition:transform .1s; flex:0 0 auto; background:#fff; overflow:hidden;}
  .sw svg{width:34px;height:34px;}
  .sw:active{transform:scale(.88);}
  .sw.sel{outline:4px solid var(--yellow); outline-offset:1px; transform:scale(1.06);}
  .bigbtn{border:none; border-radius:22px; padding:14px 22px; font-weight:800; font-size:17px;
    color:#fff; background:linear-gradient(#ff7db5,#ff4f97);
    box-shadow:0 6px 0 var(--pink-deep),0 10px 16px var(--shadow), inset 0 2px 2px #ffc2dd;
    cursor:pointer; transition:transform .1s,box-shadow .1s;}
  .bigbtn:active{transform:translateY(5px); box-shadow:0 1px 0 var(--pink-deep),0 3px 8px var(--shadow), inset 0 2px 2px #ffc2dd;}
  .bigbtn.alt{background:linear-gradient(#7fe6ca,#48c9a6); box-shadow:0 6px 0 #38b393,0 10px 16px var(--shadow), inset 0 2px 2px #c2f5e8;}
  .bigbtn.alt:active{box-shadow:0 1px 0 #38b393,0 3px 8px var(--shadow), inset 0 2px 2px #c2f5e8;}
  .bigbtn.sun{background:linear-gradient(#ffe07a,#ffcc1f); color:var(--ink); box-shadow:0 6px 0 #d9a800,0 10px 16px var(--shadow), inset 0 2px 2px #fff0bd;}
  .bigbtn.sun:active{box-shadow:0 1px 0 #d9a800,0 3px 8px var(--shadow), inset 0 2px 2px #fff0bd;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .stagecanvas{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  svg{display:block; max-width:100%; max-height:100%;}
  .idle{animation:idleFloat 3.4s ease-in-out infinite;}
  /* meter */
  .meter{position:absolute; top:12px; right:12px; background:linear-gradient(#fff,#fff0f7); padding:8px 12px; border-radius:20px;
    box-shadow:0 5px 12px var(--shadow), inset 0 1px 1px #fff; font-weight:800; font-size:14px; display:flex; align-items:center; gap:8px; z-index:6;}
  .meter svg{width:20px;height:20px;}
  .meterbar{width:90px; height:14px; background:#ffe0ec; border-radius:8px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(150,80,120,.3);}
  .meterfill{height:100%; width:50%; background:linear-gradient(90deg,var(--pink),var(--yellow)); transition:width .5s ease; box-shadow:inset 0 1px 1px rgba(255,255,255,.6);}
  /* ---------- START SCREEN ---------- */
  #start{position:absolute; inset:0; z-index:50; background:linear-gradient(160deg,#ffd9ec,#cdeaff);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; overflow:hidden;}
  #startScene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.9;}
  #start>*{position:relative;z-index:1;}
  #start h1{font-size:clamp(30px,9vw,52px); color:var(--pink-deep); text-shadow:0 3px 0 #fff,0 6px 10px var(--shadow); line-height:1.05;}
  #start p{font-size:18px; font-weight:700; color:var(--ink);}
  #nameInput{font-family:inherit; font-size:24px; font-weight:800; text-align:center; padding:14px 18px;
    border:4px solid var(--pink); border-radius:20px; background:#fff; color:var(--pink-deep); width:min(80vw,340px);
    box-shadow:0 8px 18px var(--shadow); -webkit-user-select:text; user-select:text;}
  #nameInput:focus{outline:none; border-color:var(--yellow);}
  .petpick{display:flex; gap:18px;}
  .petcard{width:120px; height:134px; border-radius:24px; background:linear-gradient(#fff,#fff2f8); border:5px solid #fff;
    box-shadow:0 8px 20px var(--shadow), inset 0 2px 3px #fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; cursor:pointer; transition:transform .12s; font-weight:800;}
  .petcard svg{width:74px;height:74px;}
  .petcard span{font-size:18px; color:var(--ink);}
  .petcard.sel{outline:5px solid var(--yellow); transform:scale(1.06);}
  .petcard:active{transform:scale(.94);}
  /* ---------- FLOATING FX ---------- */
  .fx{position:fixed; pointer-events:none; z-index:60; will-change:transform,opacity;}
  .fx svg{width:100%;height:100%;}
  @keyframes floatUp{0%{transform:translateY(0) scale(.4); opacity:0;}
    20%{opacity:1; transform:translateY(-10px) scale(1.1);}
    100%{transform:translateY(-170px) scale(.8); opacity:0;}}
  @keyframes pop{0%{transform:scale(0) rotate(0);}60%{transform:scale(1.3) rotate(20deg);}100%{transform:scale(0) rotate(40deg); opacity:0;}}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0); opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg); opacity:.9;}}
  @keyframes bounceIn{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  .wiggle{animation:wiggle .6s ease-in-out infinite;}
  @keyframes idleFloat{0%,100%{transform:translateY(0) rotate(-.6deg);}50%{transform:translateY(-10px) rotate(.6deg);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes sway{0%,100%{transform:translateX(-3px) rotate(-2deg);}50%{transform:translateX(3px) rotate(2deg);}}
  .toast{position:fixed; left:50%; top:42%; transform:translate(-50%,-50%) scale(0); z-index:70;
    background:linear-gradient(#fff,#fff0f7); color:var(--pink-deep); font-weight:900; font-size:clamp(34px,10vw,64px);
    padding:18px 36px; border-radius:40px; box-shadow:0 14px 34px var(--shadow), inset 0 2px 3px #fff; pointer-events:none;
    text-shadow:0 2px 0 #ffe3f1;}
  @keyframes toastPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg);}
    50%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg);}
    80%{transform:translate(-50%,-50%) scale(1) rotate(0);}
    100%{transform:translate(-50%,-50%) scale(0) rotate(0); opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title"></div>
    <div style="display:flex;gap:10px;">
      <button class="iconbtn" id="muteBtn" aria-label="sound">🔊</button>
      <button class="iconbtn" id="homeBtn" aria-label="start over">🔄</button>
    </div>
  </div>
  <div id="stage"></div>
  <div id="nav"></div>
</div>
<!-- START SCREEN -->
<div id="start">
  <div id="startScene"></div>
  <h1>✨ Dream House ✨</h1>
  <p>What's your name?</p>
  <input id="nameInput" maxlength="14" placeholder="Type here" autocomplete="off" autocorrect="off">
  <p>Pick your best friend!</p>
  <div class="petpick">
    <div class="petcard" data-pet="dog"><span>Puppy</span></div>
    <div class="petcard" data-pet="cat"><span>Kitty</span></div>
  </div>
  <button class="bigbtn" id="playBtn" style="margin-top:6px;font-size:22px;padding:16px 40px;">Let's Play! 🎀</button>
</div>
<script>
"use strict";
/* =========================================================================
   SAFE STORAGE
   ========================================================================= */
const mem = {};
const Store = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return (k in mem)?mem[k]:d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
/* =========================================================================
   SOUND (Web Audio, fully offline)
   ========================================================================= */
let AC=null, muted=Store.get('muted',false);
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,dur,type='sine',vol=.18){
  if(muted)return; const a=ac(); if(!a)return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
  const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur);
}
const S={
  pop(){ tone(540+Math.random()*120,.12,'triangle',.16); },
  tap(){ tone(720,.08,'sine',.12); },
  sparkle(){ [880,1180,1480].forEach((f,i)=>setTimeout(()=>tone(f,.16,'sine',.12),i*60)); },
  happy(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.16),i*90)); },
  yum(){ [659,784,988,1319].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sine',.18),i*110)); },
  squeak(){ tone(1200,.07,'square',.10); setTimeout(()=>tone(1500,.07,'square',.10),70); },
  splash(){ tone(300,.18,'sawtooth',.10); tone(180,.22,'sine',.08); },
  woof(){ tone(220,.12,'sawtooth',.16); setTimeout(()=>tone(180,.14,'sawtooth',.14),120); },
  meow(){ tone(620,.18,'sine',.14); setTimeout(()=>tone(520,.18,'sine',.12),160); },
  party(){ const n=[523,659,784,659,784,1047,988,1047]; n.forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.15),i*130)); }
};
/* =========================================================================
   VOICE NARRATION — built-in browser speech (offline, no files, free).
   Lets a pre-reader play alone: names colors, counts, greets by name.
   Obeys the same mute button as the sound effects.
   ========================================================================= */
let VOICE=null;
function pickVoice(){ try{ const vs=window.speechSynthesis.getVoices(); if(!vs||!vs.length)return;
  const pref=['Samantha','Karen','Moira','Tessa','Victoria','Fiona','Google UK English Female','Google US English'];
  VOICE = vs.find(v=>pref.indexOf(v.name)>=0) || vs.find(v=>/female/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || vs[0];
 }catch(e){} }
try{ if(window.speechSynthesis){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; } }catch(e){}
function say(txt){ if(muted||!txt)return; try{ const sy=window.speechSynthesis; if(!sy)return;
  sy.cancel(); const u=new SpeechSynthesisUtterance(txt); if(VOICE)u.voice=VOICE;
  u.rate=.95; u.pitch=1.3; u.volume=1; sy.speak(u);
 }catch(e){} }
const COUNT=['one','two','three','four','five','six','seven','eight','nine','ten'];
function sayCount(n){ say(COUNT[Math.min(Math.max(n,1),10)-1]); }
const COLORNAME={ '#ff5fa2':'pink','#ff7db5':'pink','#ff6bd1':'pink','#e85a7a':'pink','#d94f7a':'pink','#ff3b6b':'red','#ff3b54':'red','#ff3b6b ':'red','#ffd23f':'yellow','#e0a000':'gold','#5fd6b4':'green','#48c9a6':'green','#b79cff':'purple','#7b4fd9':'purple','#3aa0ff':'blue','#6aa6ff':'blue','#ff8a3d':'orange','#ffffff':'white','#5a3d52':'dark','#2b1a12':'brown','#6b3b1f':'brown','#7a4a2b':'brown','#a9692e':'brown','#e8e8e8':'silver' };
function sayColor(hex){ const n=COLORNAME[hex]; if(n)say(n+'!'); }
const ROOMSAY={ closet:"Let's play dress up!", salon:"Welcome to the salon!", kitchen:"Let's bake a cake!", pet:"Say hi to your pet!", bedroom:"Time for the bedroom!", bath:"Bubble bath time!", garden:"Let's visit the garden!", pool:"Pool party!", party:"Let's have a party!" };
/* =========================================================================
   GAME STATE
   ========================================================================= */
const DEFAULT={
  name:'', pet:'dog', petName:'',
  doll:{ skin:'#f3c8a6', hair:'long', hairColor:'#6b3b1f', outfit:'dress', outfitColor:'#ff5fa2',
         shoes:'#ff3b6b', lip:'#e85a7a', accessories:{crown:false,bow:true,glasses:false,flower:false,necklace:false} },
  petState:{ happiness:60, clean:true },
  bedroom:{ time:'day', wall:'#ffe3f1' },
  garden:[false,false,false,false]
};
let G = Object.assign({}, DEFAULT, Store.get('game', {}));
G.doll = Object.assign({}, DEFAULT.doll, G.doll); G.doll.accessories=Object.assign({},DEFAULT.doll.accessories,G.doll.accessories);
G.petState=Object.assign({},DEFAULT.petState,G.petState);
G.bedroom=Object.assign({},DEFAULT.bedroom,G.bedroom);
if(!Array.isArray(G.garden))G.garden=DEFAULT.garden.slice();
function save(){ Store.set('game',G); }
/* =========================================================================
   COLOR HELPER
   ========================================================================= */
function shade(hex,amt){
  let n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
let UID=0; const uid=p=>p+(++UID);
/* =========================================================================
   ICON LIBRARY — all custom vector art (no emoji, no external files)
   Each returns SVG markup in a 0 0 100 100 viewBox unless noted.
   ========================================================================= */
function glossDot(cx,cy,r){ return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*.7}" fill="#fff" opacity=".55"/>`; }
const ICON={
  heart(c='#ff4f97'){ const g=uid('h'); return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c,40)}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><path d="M50 86 C12 58 16 24 38 24 C48 24 50 34 50 34 C50 34 52 24 62 24 C84 24 88 58 50 86Z" fill="url(#${g})"/>${glossDot(38,40,9)}</svg>`; },
  star(c='#ffd23f'){ const g=uid('s'); return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${g}" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="${shade(c,40)}"/><stop offset="1" stop-color="${shade(c,-25)}"/></radialGradient></defs><path d="M50 8 L61 38 L93 39 L67 59 L77 90 L50 71 L23 90 L33 59 L7 39 L39 38Z" fill="url(#${g})" stroke="${shade(c,-40)}" stroke-width="2"/></svg>`; },
  sparkle(c='#fff7b0'){ return `<svg viewBox="0 0 100 100"><path d="M50 6 C54 38 62 46 94 50 C62 54 54 62 50 94 C46 62 38 54 6 50 C38 46 46 38 50 6Z" fill="${c}" opacity=".95"/></svg>`; },
  flower(c='#ff5fa2'){ const g=uid('f'); return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${g}" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="${shade(c,45)}"/><stop offset="1" stop-color="${c}"/></radialGradient></defs>${[0,72,144,216,288].map(a=>`<ellipse cx="50" cy="28" rx="13" ry="20" fill="url(#${g})" transform="rotate(${a} 50 50)"/>`).join('')}<circle cx="50" cy="50" r="12" fill="#ffd23f"/>${glossDot(46,46,5)}</svg>`; },
  tulip(c='#ff7db5'){ const g=uid('tu'); return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c,40)}"/><stop offset="1" stop-color="${shade(c,-15)}"/></linearGradient></defs><path d="M30 92 C30 70 30 60 50 56 C70 60 70 70 70 92" fill="none" stroke="#4bbf86" stroke-width="6"/><path d="M28 50 C28 30 40 22 50 22 C60 22 72 30 72 50 C72 64 60 70 50 70 C40 70 28 64 28 50Z" fill="url(#${g})"/><path d="M50 22 L50 66" stroke="${shade(c,-30)}" stroke-width="3" opacity=".5"/></svg>`; },
  balloon(c='#ff5fa2'){ const g=uid('b'); return `<svg viewBox="0 0 100 130"><defs><radialGradient id="${g}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="${shade(c,55)}"/><stop offset="1" stop-color="${shade(c,-20)}"/></radialGradient></defs><path d="M50 8 C76 8 84 34 84 52 C84 78 64 92 50 92 C36 92 16 78 16 52 C16 34 24 8 50 8Z" fill="url(#${g})"/><path d="M50 92 L46 100 L54 100Z" fill="${shade(c,-20)}"/><path d="M50 100 C58 110 42 118 50 128" fill="none" stroke="#b98" stroke-width="2"/>${glossDot(38,34,10)}</svg>`; },
  bubble(){ const g=uid('bu'); return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${g}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".6" stop-color="#cdeeff" stop-opacity=".35"/><stop offset="1" stop-color="#8fd3ff" stop-opacity=".55"/></radialGradient></defs><circle cx="50" cy="50" r="44" fill="url(#${g})" stroke="#bfeaff" stroke-width="2"/><ellipse cx="36" cy="34" rx="12" ry="8" fill="#fff" opacity=".85"/></svg>`; },
  droplet(c='#6ec1ff'){ const g=uid('d'); return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${g}" cx=".4" cy=".55" r=".7"><stop offset="0" stop-color="${shade(c,45)}"/><stop offset="1" stop-color="${shade(c,-15)}"/></radialGradient></defs><path d="M50 8 C50 8 80 48 80 66 C80 84 66 94 50 94 C34 94 20 84 20 66 C20 48 50 8 50 8Z" fill="url(#${g})"/>${glossDot(40,60,8)}</svg>`; },

function spriteAt(x,y,svg,anim='floatUp',size=34){
  const el=document.createElement('div'); el.className='fx'; el.innerHTML=svg;
  el.style.width=size+'px'; el.style.height=size+'px';
  el.style.left=(x-size/2)+'px'; el.style.top=(y-size/2)+'px';
  el.style.animation=anim+' 1.1s ease-out forwards';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1150);
}
function hearts(x,y,n=5){ for(let i=0;i<n;i++)setTimeout(()=>spriteAt(x+(Math.random()*60-30),y,ICON.heart(),'floatUp',30),i*90); }
function sparkles(x,y,n=6){ for(let i=0;i<n;i++)setTimeout(()=>spriteAt(x+(Math.random()*80-40),y+(Math.random()*40-20), i%2?ICON.sparkle():ICON.star(),'pop',26),i*60); }
function confetti(n=60){
  const cols=['#ff5fa2','#ffd23f','#5fd6b4','#6aa6ff','#ff8a3d','#b79cff'];
  for(let i=0;i<n;i++){ const el=document.createElement('div'); el.className='fx';
    if(i%5===0){ el.innerHTML=ICON.heart(cols[i%cols.length]); el.style.width='22px'; el.style.height='22px'; }
    else if(i%5===1){ el.innerHTML=ICON.star(cols[i%cols.length]); el.style.width='22px'; el.style.height='22px'; }
    else { el.style.width=(8+Math.random()*8)+'px'; el.style.height=(12+Math.random()*8)+'px';
      el.style.background=cols[i%cols.length]; el.style.borderRadius='3px'; }
    el.style.left=Math.random()*100+'vw'; el.style.top='-40px';
    el.style.animation=`confettiFall ${1.6+Math.random()*1.4}s linear forwards`; el.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(el); setTimeout(()=>el.remove(),3800); }
}

}

/* swatch row: items are color strings OR [value, svgMarkup] for icon swatches */
function swatchRow(items, getSel, onPick, mode){
  const wrap=el('<div class="swatches"></div>');
  items.forEach(it=>{
    const val=Array.isArray(it)?it[0]:it;
    const s=el('<div class="sw"></div>');
    if(Array.isArray(it)){ s.innerHTML=it[1]; }
    else { s.style.background=val; }
    if(getSel()===val) s.classList.add('sel');
    s.addEventListener('click',()=>{ S.pop(); onPick(val);
      if(typeof val==='string'&&val.charAt(0)==='#') sayColor(val);
      wrap.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); });
    wrap.appendChild(s);
  });
  return wrap;
}

/* =========================================================================
   ROOM: KITCHEN
   ========================================================================= */
function roomKitchen(){
  const r=el(`<div class="room">
    <div class="scene"><div class="sceneBg">${SCENE.kitchen()}</div><div class="roomname">Bake a Cake</div>
      <div class="stagecanvas"><div id="bakeArea" style="text-align:center;"></div></div></div>
    <div class="tray"><div id="kitchenTray"></div></div></div>`);
  const area=r.querySelector('#bakeArea'); const tray=r.querySelector('#kitchenTray');
  let phase='mix', added=[], frosting='#ff5fa2', toppings=[];
  const INGR=[['egg',ICON.egg()],['milk',ICON.milk()],['flour',ICON.flour()],['cocoa',ICON.cocoa()],['sugar',ICON.sugar()]];
  const ic=s=>`<span style="display:inline-block;width:34px;height:34px;vertical-align:middle;">${s}</span>`;
  function bowlSVG(){ return `<svg viewBox="0 0 200 160" width="150"><ellipse cx="100" cy="150" rx="64" ry="10" fill="#5a3d52" opacity=".15"/><path d="M30 70 Q100 64 170 70 L150 130 Q100 148 50 130Z" fill="#eef3f8" stroke="#cbd5e0" stroke-width="4"/><path d="M40 78 Q100 84 160 78 L156 92 Q100 100 44 92Z" fill="#ffe0ad"/><ellipse cx="70" cy="84" rx="10" ry="5" fill="#fff" opacity=".6"/></svg>`; }
  function cakeSVG(fr,tops){ const lt=shade(fr,30),dk=shade(fr,-20);
    const tp=tops.map((t,i)=>`<g transform="translate(${60+(i%4)*22},${36+Math.floor(i/4)*18}) scale(.22)">${t.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`).join('');
    return `<svg viewBox="0 0 200 200" width="170"><ellipse cx="100" cy="186" rx="70" ry="10" fill="#5a3d52" opacity=".15"/>
      <rect x="36" y="96" width="128" height="74" rx="10" fill="#e8b98a"/><rect x="36" y="96" width="128" height="14" fill="#d8a571"/>
      <path d="M30 96 Q100 70 170 96 L170 110 Q100 128 30 110Z" fill="${fr}"/>
      ${[...Array(7)].map((_,i)=>`<path d="M${30+i*23} 104 q6 14 0 22" stroke="${lt}" stroke-width="5" fill="none"/>`).join('')}
      <rect x="92" y="50" width="16" height="34" rx="3" fill="#ffd23f"/><rect x="92" y="50" width="16" height="6" fill="#fff"/>
      <path d="M100 38 Q108 48 100 50 Q92 48 100 38Z" fill="#ff8a3d"/>${tp}</svg>`; }
  function render(){
    if(phase==='mix'){
      area.innerHTML=`${bowlSVG()}<div style="font-size:18px;min-height:34px;">${added.map(a=>ic(a[1])).join('')}</div>`;
      tray.innerHTML=''; const lbl=el('<div style="text-align:center;font-weight:800;">Tap to add, then mix!</div>');
      const wrap=el('<div class="swatches" style="justify-content:center;"></div>');
      INGR.forEach(it=>{ const s=el(`<div class="sw">${it[1]}</div>`);
        s.addEventListener('click',ev=>{ S.pop(); added.push(it); say(it[0]+'!'); spriteAt(ev.clientX,ev.clientY,it[1],'pop',30); render(); });
        wrap.appendChild(s); });
      const mixBtn=el('<button class="bigbtn alt">🥄 Mix it!</button>');
      mixBtn.addEventListener('click',()=>{ if(added.length<2){toast('Add more!');return;}
        S.sparkle(); say('Mixing!'); const b=area.querySelector('svg'); if(b)b.style.animation='wiggle .5s ease 2'; phase='bake'; setTimeout(render,1000); });
      tray.appendChild(lbl); tray.appendChild(wrap);
      const br=el('<div class="btnrow"></div>'); br.appendChild(mixBtn); tray.appendChild(br);
    } else if(phase==='bake'){
      area.innerHTML=`<svg viewBox="0 0 200 160" width="150"><rect x="30" y="40" width="140" height="110" rx="14" fill="#f3f6fa" stroke="#cbd5e0" stroke-width="5"/><rect x="44" y="56" width="112" height="66" rx="8" fill="#5a4636"/><ellipse cx="100" cy="92" rx="40" ry="24" fill="#ff8a3d" opacity=".7"/><circle cx="60" cy="138" r="6" fill="#cbd5e0"/></svg>
        <div style="font-weight:800;font-size:18px;">Baking...</div>
        <div class="meterbar" style="width:160px;margin:8px auto;"><div class="meterfill" id="bakeBar" style="width:0;"></div></div>`;
      tray.innerHTML='<div style="text-align:center;font-weight:800;">Smells yummy! 🤤</div>';
      let p=0; const bar=area.querySelector('#bakeBar');
      const iv=setInterval(()=>{ p+=10; bar.style.width=p+'%'; S.tap(); if(p>=100){clearInterval(iv); phase='decorate'; S.happy(); render();} },260);
    } else if(phase==='decorate'){
      area.innerHTML=cakeSVG(frosting,toppings);
      tray.innerHTML='';
      tray.appendChild(el('<div style="text-align:center;font-weight:800;">Frosting color</div>'));
      tray.appendChild(swatchRow(BRIGHT.slice(0,6),()=>frosting,v=>{frosting=v;render();}));
      tray.appendChild(el('<div style="text-align:center;font-weight:800;">Toppings</div>'));
      const tops=[ICON.strawberry(),ICON.cherry(),ICON.rainbow(),ICON.star(),ICON.candy(),ICON.cupcake()];
      const tw=el('<div class="swatches" style="justify-content:center;"></div>');
      tops.forEach(svg=>{ const s=el(`<div class="sw">${svg}</div>`);
        s.addEventListener('click',ev=>{ S.pop(); toppings.push(svg); sayCount(toppings.length); spriteAt(ev.clientX,ev.clientY,svg,'pop',28); render(); }); tw.appendChild(s); });
      tray.appendChild(tw);
      const done=el('<div class="btnrow"><button class="bigbtn">😋 Yum! Eat it!</button></div>');
      done.querySelector('button').addEventListener('click',()=>{ S.yum(); say('Yum yum yum!'); confetti(70); toast('YUM! 😋');
        added=[]; toppings=[]; phase='mix'; setTimeout(render,1700); });
      tray.appendChild(done);
    }
  }
  render();
  return r;
}

  function bump(n){ G.petState.happiness=Math.min(100,G.petState.happiness+n); fill.style.width=G.petState.happiness+'%'; save(); }
  draw();
  r.querySelector('#feedBtn').addEventListener('click',e=>{ S.pop(); say('Yummy!'); spriteAt(e.clientX,e.clientY,ICON.bone(),'floatUp',34);
    const b=canvas.getBoundingClientRect(); hearts(b.left+b.width/2,b.top+b.height/2,3); bump(6); });
  r.querySelector('#playBtnP').addEventListener('click',()=>{ S[G.pet==='dog'?'woof':'meow'](); say('Fetch!');
    const b=canvas.getBoundingClientRect(); spriteAt(b.left+b.width/2,b.top+b.height/3,ICON.ball(),'floatUp',38);
    const c=canvas.firstElementChild; c.classList.remove('idle'); c.classList.add('wiggle'); setTimeout(()=>{c.classList.remove('wiggle');c.classList.add('idle');},900); bump(6); });
  r.querySelector('#bathBtn').addEventListener('click',()=>{ S.splash(); say('Splish splash!'); G.petState.clean=true; save(); draw();
    const b=canvas.getBoundingClientRect(); for(let i=0;i<8;i++)setTimeout(()=>spriteAt(b.left+b.width/2+(Math.random()*80-40),b.top+b.height/2,ICON.bubble(),'floatUp',26),i*70); });
  return r;
}
/* =========================================================================
   ROOM: BEDROOM
   ========================================================================= */
function roomBedroom(){
  const r=el(`<div class="room">
    <div class="scene" id="bedScene"><div class="sceneBg" id="bedBg"></div><div class="roomname">Bedroom</div>
      <div class="stagecanvas" id="bedCanvas"></div></div>
    <div class="tray">
      <div class="btnrow"><button class="bigbtn sun" id="dayNight"></button>
        <button class="bigbtn alt" id="tuckBtn">😴 Tuck in</button></div>
      <div style="text-align:center;font-weight:800;">Wallpaper</div>
      <div id="wallRow"></div></div></div>`);
  const bg=r.querySelector('#bedBg'); const canvas=r.querySelector('#bedCanvas');
  let sleeping=false;
  function bedScene(night,wall){
    const wallTop=night?shade(wall,-10):'#ffffff';
    const sky=night?'#1d1640':'#bfe9ff';
    return `<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="600" fill="${night?shade(wall,-30):wall}"/>
      <rect width="400" height="200" fill="${wallTop}"/>
      <rect y="430" width="400" height="170" fill="${shade(wall,-22)}"/><rect y="430" width="400" height="12" fill="${shade(wall,-34)}"/>
      <g transform="translate(250,120)"><rect x="-6" y="-6" width="120" height="120" rx="12" fill="#fff" stroke="${shade(wall,-20)}" stroke-width="6"/><rect width="108" height="108" fill="${sky}"/>
        ${night?`<circle cx="80" cy="28" r="16" fill="#fff"/><circle cx="72" cy="24" r="14" fill="${sky}"/>${[...Array(6)].map(()=>`<circle cx="${Math.random()*100}" cy="${Math.random()*100}" r="1.6" fill="#fff"/>`).join('')}`:`<circle cx="84" cy="26" r="18" fill="#ffe07a"/>${cloud(34,60)}`}
        <line x1="54" y1="0" x2="54" y2="108" stroke="#fff" stroke-width="4"/><line x1="0" y1="54" x2="108" y2="54" stroke="#fff" stroke-width="4"/></g>
      <g transform="translate(40,360)"><rect x="-10" y="40" width="180" height="80" rx="10" fill="#b79cff"/><rect x="-10" y="20" width="50" height="40" rx="8" fill="#fff"/><rect x="-10" y="50" width="180" height="30" rx="8" fill="#ff9ec0"/></g>
    </svg>`;
  }
  function paint(){
    const night=G.bedroom.time==='night';
    bg.innerHTML=bedScene(night,G.bedroom.wall);
    canvas.innerHTML=`<div class="${sleeping?'':'idle'}">${renderDoll({sleeping, w:Math.min(220,window.innerWidth*.55)})}</div>`;
    r.querySelector('#dayNight').textContent= night?'☀️ Day':'🌙 Night';
  }
  paint();
  r.querySelector('#dayNight').addEventListener('click',()=>{ S.tap(); G.bedroom.time=G.bedroom.time==='night'?'day':'night'; save(); paint(); say(G.bedroom.time==='night'?'Good night!':'Good morning!'); });
  r.querySelector('#tuckBtn').addEventListener('click',()=>{ sleeping=!sleeping; if(sleeping){S.sparkle(); G.bedroom.time='night'; save(); say('Sweet dreams!');} paint(); });
  r.querySelector('#wallRow').appendChild(swatchRow(WALL,()=>G.bedroom.wall,v=>{G.bedroom.wall=v;save();paint();}));
  return r;
}

function roomBath(){
  const r=el(`<div class="room">
    <div class="scene"><div class="sceneBg">${SCENE.bath()}</div><div class="roomname">Bubble Bath</div>
      <div class="stagecanvas"><div id="tub" style="position:relative;width:min(86vw,420px);height:60%;
        background:linear-gradient(#ffffff,#eef7ff);border-radius:0 0 44px 44px;border:8px solid #fff;box-shadow:0 12px 28px var(--shadow);overflow:hidden;">
        <div style="position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(#a6dcff,#5fc0ff);"></div>
        <div style="position:absolute;bottom:50%;left:0;right:0;height:8px;background:#fff;opacity:.5;border-radius:50%;"></div>
        <div id="duck" style="position:absolute;bottom:44%;left:40%;width:64px;height:64px;cursor:pointer;">${ICON.duck()}</div>
        <div id="bubbleLayer" style="position:absolute;inset:0;"></div>
      </div></div></div>
    <div class="tray"><div class="btnrow">
      <button class="bigbtn" id="bubbleBtn">🫧 More Bubbles!</button>
      <button class="bigbtn alt" id="drainBtn">🌀 Drain</button></div>
      <div style="text-align:center;font-weight:700;">Tap bubbles to pop them, tap the duck to squeak!</div></div></div>`);
  const layer=r.querySelector('#bubbleLayer');
  function addBubbles(n){ for(let i=0;i<n;i++){ const b=document.createElement('div');
    const sz=24+Math.random()*44; b.innerHTML=ICON.bubble(); b.style.position='absolute'; b.style.width=sz+'px'; b.style.height=sz+'px';
    b.style.left=Math.random()*82+'%'; b.style.bottom=(20+Math.random()*55)+'%'; b.style.cursor='pointer';
    b.style.animation='bounceIn .4s ease'; b.addEventListener('click',ev=>{ ev.stopPropagation(); S.pop(); spriteAt(ev.clientX,ev.clientY,ICON.sparkle(),'pop',24); b.remove(); });
    layer.appendChild(b); } }
  r.querySelector('#bubbleBtn').addEventListener('click',()=>{ S.splash(); say('Bubbles!'); addBubbles(8); });
  r.querySelector('#drainBtn').addEventListener('click',()=>{ S.splash(); layer.innerHTML=''; });
  r.querySelector('#duck').addEventListener('click',e=>{ S.squeak(); say('Squeak!'); const d=r.querySelector('#duck'); d.style.animation='wiggle .4s'; setTimeout(()=>d.style.animation='',420); spriteAt(e.clientX,e.clientY,ICON.star('#ffd23f'),'floatUp',24); });
  setTimeout(()=>addBubbles(6),200);
  return r;
}
/* =========================================================================
   ROOM: GARDEN
   ========================================================================= */
function roomGarden(){
  const r=el(`<div class="room">
    <div class="scene"><div class="sceneBg">${SCENE.garden()}</div><div class="roomname">Garden</div>
      <div class="stagecanvas" style="align-items:flex-end;padding-bottom:8%;">
        <div id="pots" style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;"></div></div></div>
    <div class="tray"><div class="btnrow"><button class="bigbtn alt" id="waterAll">💧 Water them all!</button></div>
      <div style="text-align:center;font-weight:700;">Tap a pot to grow a flower! 🌱</div></div></div>`);
  const pots=r.querySelector('#pots'); const FCOL=['#ff5fa2','#ff7db5','#ffd23f','#b79cff','#6aa6ff','#ff8a3d'];
  function potSVG(bloom,i){ const flower= bloom? `<g transform="translate(50,8) scale(.42)">${(i%2?ICON.tulip(FCOL[i%FCOL.length]):ICON.flower(FCOL[i%FCOL.length])).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>` : `<g><rect x="46" y="40" width="8" height="40" rx="4" fill="#4bbf86"/><path d="M50 56 q-16 -6 -20 6 q14 4 20 -6Z" fill="#5fd6b4"/></g>`;
    return `<svg viewBox="0 0 100 130" width="70">${flower}<path d="M28 84 L72 84 L66 120 L34 120Z" fill="#e08a5a"/><rect x="26" y="80" width="48" height="10" rx="4" fill="#c97a4a"/><ellipse cx="50" cy="84" rx="22" ry="5" fill="#7a4a2b"/></svg>`; }
  function paint(){ pots.innerHTML='';
    G.garden.forEach((bloom,i)=>{ const p=el(`<div style="cursor:pointer;">${potSVG(bloom,i)}</div>`);
      p.addEventListener('click',e=>{ if(!G.garden[i]){ S.sparkle(); G.garden[i]=true; save(); paint(); say('A flower!');
          spriteAt(e.clientX,e.clientY,ICON.droplet(),'floatUp',30); setTimeout(()=>spriteAt(e.clientX,e.clientY-20,ICON.butterfly(),'floatUp',32),400); }
        else { S.pop(); say('Butterfly!'); spriteAt(e.clientX,e.clientY,ICON.butterfly(FCOL[i%FCOL.length]),'floatUp',32); } });
      pots.appendChild(p); });
  }
  paint();
  r.querySelector('#waterAll').addEventListener('click',()=>{ S.sparkle(); G.garden=G.garden.map(()=>true); save(); paint();
    for(let i=0;i<6;i++)setTimeout(()=>spriteAt(Math.random()*window.innerWidth, window.innerHeight*0.42, ICON.butterfly(FCOL[i%FCOL.length]),'floatUp',32),i*150); });
  return r;
}

/* =========================================================================
   ROOM REGISTRY + NAVIGATION
   ========================================================================= */
const ROOMS=[
  {id:'closet', icon:NAVICON.closet, label:'Dress', build:roomCloset},
  {id:'salon',  icon:NAVICON.salon,  label:'Salon', build:roomSalon},
  {id:'kitchen',icon:NAVICON.kitchen,label:'Bake',  build:roomKitchen},
  {id:'pet',    icon:NAVICON.pet,    label:'Pet',   build:roomPet},
  {id:'bedroom',icon:NAVICON.bedroom,label:'Bed',   build:roomBedroom},
  {id:'bath',   icon:NAVICON.bath,   label:'Bath',  build:roomBath},
  {id:'garden', icon:NAVICON.garden, label:'Garden',build:roomGarden},
  {id:'pool',   icon:NAVICON.pool,   label:'Pool',  build:roomPool},
  {id:'party',  icon:NAVICON.party,  label:'Party', build:roomParty},
];
const stage=document.getElementById('stage');
const nav=document.getElementById('nav');
let current=null;
function openRoom(id,quiet){
  S.tap();
  const def=ROOMS.find(x=>x.id===id); if(!def)return;
  stage.innerHTML=''; const node=def.build(); stage.appendChild(node);
  requestAnimationFrame(()=>node.classList.add('active'));
  current=id;
  nav.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  if(!quiet) say(ROOMSAY[id]||'');
}
function buildNav(){
  nav.innerHTML='';
  ROOMS.forEach(rm=>{ const b=el(`<button class="navbtn" data-id="${rm.id}"><span class="e">${rm.icon}</span>${rm.label}</button>`);
    b.addEventListener('click',()=>openRoom(rm.id)); nav.appendChild(b); });
}

   TOP BAR
   ========================================================================= */
document.getElementById('title').innerHTML=ICON.home()+'<span id="titleName">Dream House</span>';
const muteBtn=document.getElementById('muteBtn');
function paintMute(){ muteBtn.textContent=muted?'🔇':'🔊'; }
paintMute();
muteBtn.addEventListener('click',()=>{ muted=!muted; Store.set('muted',muted); paintMute(); if(!muted)S.tap(); });
document.getElementById('homeBtn').addEventListener('click',()=>{
  if(confirm('Start over? Your name and pet will reset.')){ Store.set('game',{}); location.reload(); }
});
/* =========================================================================
   START SCREEN
   ========================================================================= */
const startEl=document.getElementById('start');
const nameInput=document.getElementById('nameInput');
document.getElementById('startScene').innerHTML=`<svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="stG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9ec"/><stop offset="1" stop-color="#cdeaff"/></linearGradient></defs><rect width="400" height="700" fill="url(#stG)"/><g transform="translate(330,90)"><circle r="44" fill="#fff3a0"/></g>${cloud(80,140)}${cloud(300,220)}${cloud(140,330)}<g transform="translate(120,520)" opacity=".5">${pennant()}</g></svg>`;
/* draw pet previews */
document.querySelectorAll('.petcard').forEach(c=>{ const isDog=c.dataset.pet==='dog'; const save0=G.pet; G.pet=c.dataset.pet;
  c.insertAdjacentHTML('afterbegin', renderPet()); G.pet=save0; });
let chosenPet=G.pet||'dog';
document.querySelectorAll('.petcard').forEach(c=>{
  if(c.dataset.pet===chosenPet)c.classList.add('sel');
  c.addEventListener('click',()=>{ S.pop(); chosenPet=c.dataset.pet;
    document.querySelectorAll('.petcard').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); });
});
document.getElementById('playBtn').addEventListener('click',()=>{
  ac();
  const nm=(nameInput.value||'').trim()||'Friend';
  G.name=nm; G.pet=chosenPet; if(!G.petName)G.petName=(chosenPet==='dog'?'Puppy':'Kitty'); save();
  startGame();
});
function startGame(){
  document.getElementById('titleName').textContent=(G.name?G.name+"'s":'My')+' Dream House';
  startEl.style.display='none';
  buildNav(); openRoom('closet',true); S.happy();
  say('Welcome to '+(G.name||'your')+"'s Dream House!");
}
if(G.name){ nameInput.value=G.name; startGame(); }
else { nameInput.focus(); }
window.addEventListener('resize',()=>{ if(current)openRoom(current,true); });
</script>
</body>
</html>
