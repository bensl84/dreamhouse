<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glam Preview</title>
<style>
  body{margin:0;min-height:100vh;font-family:'ui-rounded','SF Pro Rounded','Comic Sans MS',sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#ffe9f4,#dcefff 60%,#cfe6ff);color:#5a3d52;
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;}
  h1{color:#e63d86;text-shadow:0 2px 0 #fff;margin:2px 0;font-size:24px;text-align:center;}
  p.sub{margin:0 0 8px;font-weight:700;opacity:.7;text-align:center;}
  .row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:stretch;width:100%;max-width:920px;}
  .card{background:rgba(255,255,255,.6);border-radius:28px;padding:14px;flex:1 1 340px;min-width:320px;
    box-shadow:0 18px 40px rgba(120,60,100,.18),inset 0 2px 3px #fff;backdrop-filter:blur(6px);}
  .card h2{margin:2px 0 10px;font-size:16px;color:#e63d86;text-align:center;}
  .frame{border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(120,60,100,.18);background:#fff;}
  .frame svg{display:block;width:100%;height:auto;}
  .float{animation:f 3.6s ease-in-out infinite;transform-origin:center bottom;}
  @keyframes f{0%,100%{transform:translateY(0) rotate(-.5deg);}50%{transform:translateY(-10px) rotate(.5deg);}}
  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .sw{width:38px;height:38px;border-radius:11px;border:3px solid #fff;cursor:pointer;box-shadow:0 4px 9px rgba(120,60,100,.2);}
  .lbl{width:100%;text-align:center;font-weight:800;color:#e63d86;margin:6px 0 2px;font-size:13px;}
</style>
</head>
<body>
  <h1>✨ Grown-up Glam + Rich Pool ✨</h1>
  <p class="sub">Tap the chips to recolor. Is this the Barbie direction?</p>
  <div class="row">
    <div class="card">
      <h2>New character — taller, glam face, long legs</h2>
      <div class="frame" id="charFrame"></div>
      <div class="lbl">Dress color</div><div class="controls" id="dressCols"></div>
      <div class="lbl">Hair color</div><div class="controls" id="hairCols"></div>
    </div>
    <div class="card">
      <h2>Pool, rebuilt rich</h2>
      <div class="frame" id="poolFrame"></div>
    </div>
  </div>
<script>
"use strict";
function shade(hex,a){let n=parseInt(hex.slice(1),16);let r=(n>>16&255)+a,g=(n>>8&255)+a,b=(n&255)+a;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
let U=0;const id=p=>p+(++U);
const D={skin:'#f6cba6',hair:'#e0a000',dress:'#ff3b6b',lip:'#d83a5e'};

/* ============== GLAM CHARACTER (adult fashion-doll proportions) ==============
   viewBox 0 0 300 620 — small head, long legs. */
function glam(opt){
  opt=opt||{}; const swim=opt.swim;
  const sk=D.skin, skD=shade(sk,-20), skL=shade(sk,18), skDD=shade(sk,-34);
  const hc=D.hair, hcD=shade(hc,-38), hcL=shade(hc,55);
  const dr=opt.color||D.dress, drD=shade(dr,-28), drL=shade(dr,34);
  const lip=D.lip;
  const sg=id('s'),hg=id('h'),dg=id('d'),eg=id('e'),cg=id('c'),lg=id('l');
  return `<svg viewBox="0 0 300 620">
  <defs>
    <radialGradient id="${sg}" cx=".42" cy=".4" r=".75"><stop offset="0" stop-color="${skL}"/><stop offset="1" stop-color="${skD}"/></radialGradient>
    <linearGradient id="${hg}" x1=".1" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${shade(hc,34)}"/><stop offset=".5" stop-color="${hc}"/><stop offset="1" stop-color="${hcD}"/></linearGradient>
    <linearGradient id="${dg}" x1=".15" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="${drL}"/><stop offset=".55" stop-color="${dr}"/><stop offset="1" stop-color="${drD}"/></linearGradient>
    <radialGradient id="${eg}" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#7a8aa0"/><stop offset=".5" stop-color="#3f5e86"/><stop offset="1" stop-color="#22324a"/></radialGradient>
    <radialGradient id="${cg}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9ec0"/><stop offset="1" stop-color="#ff9ec000"/></radialGradient>
    <linearGradient id="${lg}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(lip,30)}"/><stop offset="1" stop-color="${shade(lip,-15)}"/></linearGradient>
  </defs>
  <ellipse cx="150" cy="602" rx="74" ry="13" fill="#5a3d52" opacity=".16"/>

  <!-- back hair: long, voluminous -->
  <path d="M108 96 C66 116 60 230 78 330 C84 372 96 410 110 430 C112 360 104 300 112 250 C108 200 120 150 132 120Z" fill="${hcD}"/>
  <path d="M192 96 C234 116 240 230 222 330 C216 372 204 410 190 430 C188 360 196 300 188 250 C192 200 180 150 168 120Z" fill="${hcD}"/>
  <path d="M112 92 C80 120 78 240 96 340 C100 380 110 410 122 424 L128 200 C140 168 160 168 172 200 L178 424 C190 410 200 380 204 340 C222 240 220 120 188 92Z" fill="url(#${hg})"/>
  <path d="M120 130 C108 220 108 320 122 400" stroke="${hcL}" stroke-width="5" fill="none" opacity=".4"/>
  <path d="M180 130 C192 220 192 320 178 400" stroke="${hcL}" stroke-width="5" fill="none" opacity=".4"/>

  <!-- legs: long -->
  <path d="M134 322 C128 410 128 500 134 556 C140 564 150 564 152 556 C154 500 152 410 152 322Z" fill="url(#${sg})"/>
  <path d="M166 322 C172 410 172 500 166 556 C160 564 150 564 148 556 C146 500 148 410 148 322Z" fill="url(#${sg})"/>
  <path d="M132 320 C128 360 128 420 134 460" stroke="${skDD}" stroke-width="3" fill="none" opacity=".25"/>
  <!-- heels -->
  <path d="M128 556 C126 566 132 574 146 574 L150 558Z" fill="${drD}"/>
  <path d="M172 556 C174 566 168 574 154 574 L150 558Z" fill="${drD}"/>
  <path d="M138 572 L128 584 L150 584 L150 572Z" fill="${dr}"/>
  <path d="M162 572 L172 584 L150 584 L150 572Z" fill="${dr}"/>

  <!-- arms: slim -->
  <path d="M124 196 C100 230 92 300 96 344 C104 350 112 346 114 338 C112 296 122 240 138 210Z" fill="url(#${sg})"/>
  <path d="M176 196 C200 230 208 300 204 344 C196 350 188 346 186 338 C188 296 178 240 162 210Z" fill="url(#${sg})"/>
  <ellipse cx="104" cy="350" rx="10" ry="13" fill="url(#${sg})"/><ellipse cx="196" cy="350" rx="10" ry="13" fill="url(#${sg})"/>

  ${ swim
    ? `<!-- one-piece swimsuit -->
       <path d="M126 196 C140 188 160 188 174 196 L172 300 C160 318 140 318 128 300Z" fill="url(#${dg})"/>
       <path d="M134 196 L138 176 M166 196 L162 176" stroke="${dr}" stroke-width="6" stroke-linecap="round"/>
       <path d="M128 262 C145 272 155 272 172 262" stroke="${drL}" stroke-width="5" fill="none"/>`
    : `<!-- glam gown: fitted bodice + flowing skirt -->
       <path d="M126 196 C140 186 160 186 174 196 L178 300 L122 300Z" fill="url(#${dg})"/>
       <path d="M122 300 C112 380 96 470 80 556 C120 576 180 576 220 556 C204 470 188 380 178 300Z" fill="url(#${dg})"/>
       <path d="M150 200 L150 560" stroke="${drL}" stroke-width="4" opacity=".3"/>
       <path d="M134 312 C124 400 112 480 100 548" stroke="${drD}" stroke-width="4" fill="none" opacity=".35"/>
       <path d="M166 312 C176 400 188 480 200 548" stroke="${drD}" stroke-width="4" fill="none" opacity=".35"/>
       <path d="M80 556 C120 576 180 576 220 556" stroke="${drL}" stroke-width="5" fill="none" opacity=".5"/>
       <path d="M128 196 C140 210 160 210 172 196" stroke="${drL}" stroke-width="4" fill="none" opacity=".6"/>
       <path d="M126 220 C140 232 160 232 174 220" stroke="#fff" stroke-width="2" fill="none" opacity=".4"/>` }

  <!-- neck (long, slender) -->
  <path d="M142 150 C142 172 158 172 158 150 L158 132 L142 132Z" fill="${skD}"/>
  <ellipse cx="150" cy="174" rx="20" ry="6" fill="${skDD}" opacity=".4"/>

  <!-- head: small, oval, refined chin -->
  <path d="M150 50 C122 50 108 74 108 98 C108 122 122 142 150 152 C178 142 192 122 192 98 C192 74 178 50 150 50Z" fill="url(#${sg})"/>
  <ellipse cx="111" cy="100" r="8" fill="url(#${sg})"/><ellipse cx="189" cy="100" r="8" fill="url(#${sg})"/>
  <ellipse cx="111" cy="100" rx="4" ry="7" fill="#ffd23f"/><ellipse cx="189" cy="100" rx="4" ry="7" fill="#ffd23f"/>

  <!-- cheeks contour -->
  <circle cx="124" cy="112" r="13" fill="url(#${cg})"/><circle cx="176" cy="112" r="13" fill="url(#${cg})"/>

  <!-- arched brows -->
  <path d="M124 84 Q134 78 144 83" stroke="${hcD}" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M156 83 Q166 78 176 84" stroke="${hcD}" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- eyes: almond, eyeshadow, long lashes -->
  <path d="M122 98 C126 90 142 90 146 98 C142 106 126 106 122 98Z" fill="#efe2f2"/>
  <path d="M122 98 C126 90 142 90 146 98 C142 104 126 104 122 98Z" fill="#fff"/>
  <circle cx="134" cy="98" r="8" fill="url(#${eg})"/><circle cx="134" cy="98" r="4" fill="#10131a"/><circle cx="137" cy="95" r="2.4" fill="#fff"/>
  <path d="M120 96 C126 88 142 88 148 95" stroke="#2a1c2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M120 96 l-5 -3 M126 91 l-2 -5 M148 95 l5 -2" stroke="#2a1c2e" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M154 98 C158 90 174 90 178 98 C174 104 158 104 154 98Z" fill="#fff"/>
  <circle cx="166" cy="98" r="8" fill="url(#${eg})"/><circle cx="166" cy="98" r="4" fill="#10131a"/><circle cx="169" cy="95" r="2.4" fill="#fff"/>
  <path d="M152 95 C158 88 174 88 180 96" stroke="#2a1c2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M180 96 l5 -3 M174 91 l2 -5 M152 95 l-5 -2" stroke="#2a1c2e" stroke-width="2.4" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M148 112 q4 5 5 0" stroke="${skDD}" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- full glossy lips -->
  <path d="M138 128 C144 124 156 124 162 128 C156 126 144 126 138 128Z" fill="${shade(lip,-10)}"/>
  <path d="M138 128 C144 138 156 138 162 128 C156 134 144 134 138 128Z" fill="url(#${lg})"/>
  <ellipse cx="150" cy="131" rx="6" ry="2" fill="#fff" opacity=".4"/>

  <!-- front hair: side-swept with highlight -->
  <path d="M108 98 C104 64 124 46 150 46 C176 46 196 64 192 98 C188 80 176 70 170 84 C160 64 150 96 150 96 C150 96 138 66 128 86 C122 70 112 80 108 98Z" fill="url(#${hg})"/>
  <path d="M126 60 C150 50 176 56 188 78" stroke="${hcL}" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>
  ${swim?`<!-- sun hat + shades -->
    <ellipse cx="150" cy="60" rx="62" ry="16" fill="#ffe6a0"/><path d="M112 56 C120 30 180 30 188 56 C172 48 128 48 112 56Z" fill="#ffd86b"/><rect x="120" y="50" width="60" height="8" rx="4" fill="#ff7db5"/>
    <g fill="#3a2b4a" opacity=".82"><path d="M120 96 h22 a4 4 0 0 1 4 4 v2 a13 13 0 0 1 -26 0 v-2 a4 4 0 0 1 0 -4Z"/><path d="M158 96 h22 a4 4 0 0 1 4 4 v2 a13 13 0 0 1 -26 0 v-2 a4 4 0 0 1 0 -4Z"/><rect x="146" y="98" width="8" height="3"/></g>`
   :`<!-- subtle earrings + a flower -->
    <circle cx="111" cy="116" r="3" fill="#ffd23f"/><circle cx="189" cy="116" r="3" fill="#ffd23f"/>
    <g transform="translate(184,66) scale(.5)">${flowerMark('#ff5fa2')}</g>`}
  </svg>`;
}
function flowerMark(c){return `${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-16" rx="9" ry="14" fill="${c}" transform="rotate(${a})"/>`).join('')}<circle r="8" fill="#ffd23f"/>`;}

/* ===================== RICH POOL SCENE ===================== */
function pool(){
  return `<svg viewBox="0 0 400 460">
  <defs>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe0ff"/><stop offset="1" stop-color="#e7f7ff"/></linearGradient>
    <radialGradient id="psun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6b0"/><stop offset="1" stop-color="#ffd23f"/></radialGradient>
    <linearGradient id="pwater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6ff"/><stop offset=".5" stop-color="#46b6f0"/><stop offset="1" stop-color="#2a93d8"/></linearGradient>
    <linearGradient id="pdeck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9d2"/><stop offset="1" stop-color="#f3c8a6"/></linearGradient>
  </defs>
  <rect width="400" height="460" fill="url(#psky)"/>
  <!-- sun + rays -->
  <g transform="translate(60,58)"><g stroke="#ffd23f" stroke-width="5" stroke-linecap="round" opacity=".8">${[...Array(12)].map((_,i)=>`<line x1="${Math.cos(i*Math.PI/6)*40}" y1="${Math.sin(i*Math.PI/6)*40}" x2="${Math.cos(i*Math.PI/6)*54}" y2="${Math.sin(i*Math.PI/6)*54}"/>`).join('')}</g><circle r="34" fill="url(#psun)"/></g>
  <g fill="#fff" opacity=".9"><ellipse cx="300" cy="60" rx="34" ry="20"/><ellipse cx="330" cy="68" rx="26" ry="15"/><ellipse cx="272" cy="68" rx="22" ry="14"/></g>
  <!-- mansion hint -->
  <rect x="150" y="70" width="170" height="90" rx="8" fill="#ffd7ea" opacity=".7"/><rect x="150" y="70" width="170" height="16" fill="#ff9ec0" opacity=".7"/>
  <g fill="#cdeeff" opacity=".8"><rect x="166" y="100" width="30" height="30" rx="4"/><rect x="210" y="100" width="30" height="30" rx="4"/><rect x="254" y="100" width="30" height="30" rx="4"/></g>

  <!-- palm trees -->
  ${palm(34,150)}${palm(372,140)}

  <!-- deck -->
  <rect y="180" width="400" height="280" fill="#f6dcc0"/>
  <g opacity=".5" stroke="#e3bf98" stroke-width="2">${[...Array(8)].map((_,i)=>`<line x1="0" y1="${200+i*34}" x2="400" y2="${200+i*34}"/>`).join('')}${[...Array(9)].map((_,i)=>`<line x1="${i*50}" y1="180" x2="${i*50}" y2="460"/>`).join('')}</g>

  <!-- potted monstera -->
  <g transform="translate(30,300)"><path d="M20 60 L52 60 L46 100 L26 100Z" fill="#e08a5a"/><rect x="16" y="54" width="40" height="10" rx="4" fill="#c97a4a"/>
    <g fill="#3aa86a"><ellipse cx="20" cy="30" rx="16" ry="22" transform="rotate(-20 20 30)"/><ellipse cx="48" cy="26" rx="16" ry="22" transform="rotate(18 48 26)"/><ellipse cx="34" cy="14" rx="15" ry="22"/></g>
    <g fill="#2e8f57"><ellipse cx="34" cy="16" rx="6" ry="10"/></g></g>

  <!-- lounge chair + towel -->
  <g transform="translate(250,300)">
    <rect x="0" y="34" width="120" height="20" rx="8" fill="#ffffff"/><rect x="0" y="34" width="120" height="20" rx="8" fill="#ff8fb8" opacity=".55"/>
    <rect x="-6" y="10" width="40" height="30" rx="8" transform="rotate(-28 14 25)" fill="#ffd23f"/>
    <rect x="6" y="52" width="10" height="34" fill="#d9d9e0"/><rect x="104" y="52" width="10" height="34" fill="#d9d9e0"/>
    <rect x="2" y="30" width="56" height="14" rx="6" transform="rotate(-28 30 37)" fill="#ffffff" opacity=".85"/>
  </g>
  <!-- striped umbrella -->
  <g transform="translate(312,150)"><rect x="-3" y="0" width="6" height="170" fill="#caa46a"/>
    <path d="M-70 0 A70 70 0 0 1 70 0 Z" fill="#ff5fa2"/>
    <g fill="#fff" opacity=".9"><path d="M-70 0 A70 70 0 0 1 -38 -58 L0 0Z"/><path d="M0 0 L38 -58 A70 70 0 0 1 70 0Z"/></g>
    <circle cx="0" cy="0" r="5" fill="#ffd23f"/></g>
  <!-- drink with umbrella -->
  <g transform="translate(228,330)"><path d="M0 0 L20 0 L17 26 L3 26Z" fill="#ffd0e6" opacity=".9"/><rect x="2" y="0" width="16" height="8" fill="#ff7db5"/><rect x="12" y="-22" width="3" height="24" fill="#fff"/><path d="M13 -22 l-12 -6 l12 -2 l12 -2Z" fill="#ffd23f"/><circle cx="6" cy="3" r="3" fill="#ff5f6d"/></g>

  <!-- POOL -->
  <g transform="translate(36,236)">
    <rect x="-6" y="-6" width="300" height="196" rx="40" fill="#dff2ff"/>
    <rect width="288" height="184" rx="34" fill="url(#pwater)"/>
    <g stroke="#bfeeff" stroke-width="3" fill="none" opacity=".55">${[...Array(5)].map((_,i)=>`<path d="M14 ${36+i*32} Q80 ${24+i*32} 146 ${36+i*32} T280 ${36+i*32}"/>`).join('')}</g>
    <g fill="#fff" opacity=".5">${[...Array(7)].map(()=>`<circle cx="${20+Math.random()*250}" cy="${20+Math.random()*150}" r="${1.5+Math.random()*2.5}"/>`).join('')}</g>
    <!-- ladder -->
    <g transform="translate(250,-6)" stroke="#e8eef4" stroke-width="6" fill="none"><line x1="0" y1="0" x2="0" y2="60"/><line x1="20" y1="0" x2="20" y2="60"/><line x1="0" y1="22" x2="20" y2="22"/><line x1="0" y1="40" x2="20" y2="40"/></g>
  </g>

  <!-- beach ball -->
  <g transform="translate(60,300)"><circle r="22" fill="#fff"/><path d="M0 -22 A22 22 0 0 1 19 11 L0 0Z" fill="#ff5fa2"/><path d="M0 0 L19 11 A22 22 0 0 1 -19 11Z" fill="#ffd23f"/><path d="M0 0 L-19 11 A22 22 0 0 1 0 -22Z" fill="#5fd6b4"/><ellipse cx="-7" cy="-8" rx="5" ry="3" fill="#fff" opacity=".7"/></g>

  <!-- FLAMINGO FLOAT + character -->
  <g transform="translate(132,250)">
    <ellipse cx="40" cy="92" rx="78" ry="20" fill="#1c6fa6" opacity=".3"/>
    <ellipse cx="40" cy="74" rx="80" ry="34" fill="#ff8fc0"/><ellipse cx="40" cy="68" rx="80" ry="30" fill="#ffa6cf"/>
    <ellipse cx="40" cy="70" rx="44" ry="16" fill="#7fd6ff"/>
    <path d="M104 64 C128 44 120 8 100 6 C86 5 84 22 96 26 C84 30 88 50 104 50Z" fill="#ff8fc0"/>
    <circle cx="108" cy="14" r="5" fill="#fff"/><circle cx="109" cy="14" r="2.4" fill="#222"/>
    <path d="M112 16 L124 18 L112 22Z" fill="#ffd23f"/>
  </g>
  <g transform="translate(150,150) scale(.62)">${glamUpper()}</g>
  </svg>`;
}
function palm(x,baseY){ const flip=x>200?-1:1;
  return `<g transform="translate(${x},${baseY})"><path d="M-6 0 C-2 80 2 160 -2 260 L14 260 C8 160 10 80 8 0Z" fill="#b07a44"/>
    <g fill="#3aa86a">${[-60,-30,0,30,60,90,-90].map(a=>`<path d="M0 0 C${flip*40} ${-30+Math.abs(a)/4} ${flip*90} ${-10} ${flip*120} ${20}" stroke="#3aa86a" stroke-width="14" fill="none" transform="rotate(${a})" stroke-linecap="round"/>`).join('')}</g>
    <g fill="#7a4a2b"><circle cx="-6" cy="6" r="6"/><circle cx="8" cy="2" r="6"/><circle cx="2" cy="12" r="6"/></g></g>`;
}
/* upper body only (for the float) */
function glamUpper(){
  const sk=D.skin, skD=shade(sk,-20), skL=shade(sk,18), hc=D.hair, hcD=shade(hc,-38), hcL=shade(hc,55), lip=D.lip;
  const sg=id('us'),hg=id('uh'),eg=id('ue');
  return `<svg viewBox="60 40 180 180" width="220" style="overflow:visible"><defs>
    <radialGradient id="${sg}" cx=".42" cy=".4" r=".75"><stop offset="0" stop-color="${skL}"/><stop offset="1" stop-color="${skD}"/></radialGradient>
    <linearGradient id="${hg}" x1=".1" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${shade(hc,34)}"/><stop offset=".5" stop-color="${hc}"/><stop offset="1" stop-color="${hcD}"/></linearGradient>
    <radialGradient id="${eg}" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#7a8aa0"/><stop offset="1" stop-color="#22324a"/></radialGradient></defs>
    <path d="M108 96 C70 116 70 200 96 230 L204 230 C230 200 230 116 192 96Z" fill="${hcD}"/>
    <path d="M126 180 C120 210 118 226 124 232 L176 232 C182 226 180 210 174 180Z" fill="url(#${sg})"/>
    <path d="M150 50 C122 50 108 74 108 98 C108 122 122 142 150 152 C178 142 192 122 192 98 C192 74 178 50 150 50Z" fill="url(#${sg})"/>
    <circle cx="124" cy="112" r="13" fill="#ff9ec0" opacity=".4"/><circle cx="176" cy="112" r="13" fill="#ff9ec0" opacity=".4"/>
    <path d="M124 84 Q134 78 144 83" stroke="${hcD}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M156 83 Q166 78 176 84" stroke="${hcD}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M122 98 C126 90 142 90 146 98 C142 104 126 104 122 98Z" fill="#fff"/><circle cx="134" cy="98" r="8" fill="url(#${eg})"/><circle cx="134" cy="98" r="4" fill="#10131a"/><circle cx="137" cy="95" r="2.4" fill="#fff"/><path d="M120 96 C126 88 142 88 148 95" stroke="#2a1c2e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M154 98 C158 90 174 90 178 98 C174 104 158 104 154 98Z" fill="#fff"/><circle cx="166" cy="98" r="8" fill="url(#${eg})"/><circle cx="166" cy="98" r="4" fill="#10131a"/><circle cx="169" cy="95" r="2.4" fill="#fff"/><path d="M152 95 C158 88 174 88 180 96" stroke="#2a1c2e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M148 112 q4 5 5 0" stroke="${shade(sk,-34)}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M138 128 C144 138 156 138 162 128 C156 134 144 134 138 128Z" fill="${lip}"/>
    <path d="M108 98 C104 64 124 46 150 46 C176 46 196 64 192 98 C188 80 176 70 170 84 C160 64 150 96 150 96 C150 96 138 66 128 86 C122 70 112 80 108 98Z" fill="url(#${hg})"/>
    <path d="M126 60 C150 50 176 56 188 78" stroke="${hcL}" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>

  document.getElementById('charFrame').innerHTML='<div class="float">'+glam({swim:false})+'</div>';
  document.getElementById('poolFrame').innerHTML=pool();
}

function chips(host,arr,key){const h=document.getElementById(host);h.innerHTML='';
  arr.forEach(c=>{const s=document.createElement('div');s.className='sw';s.style.background=c;
    s.onclick=()=>{D[key]=c;render();};h.appendChild(s);});}
