<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semi-Realistic Preview</title>
<style>
  body{margin:0;min-height:100vh;font-family:'ui-rounded','SF Pro Rounded','Comic Sans MS',sans-serif;color:#5a3d52;
    background:radial-gradient(120% 120% at 50% 0%,#ffe9f4,#e6e0ff 55%,#d6e8ff);
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;}
  h1{color:#e63d86;text-shadow:0 2px 0 #fff;margin:2px 0;font-size:23px;text-align:center;}
  p.sub{margin:0 0 6px;font-weight:700;opacity:.7;text-align:center;}
  .row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:900px;}
  .card{background:rgba(255,255,255,.6);border-radius:28px;padding:14px;
    box-shadow:0 18px 40px rgba(120,60,100,.18),inset 0 2px 3px #fff;backdrop-filter:blur(6px);}
  .card h2{margin:2px 0 8px;font-size:15px;color:#e63d86;text-align:center;}
  .frame{border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(120,60,100,.2);
    background:linear-gradient(160deg,#fff,#ffe9f4);}
  .frame svg{display:block;height:auto;}
  .float{animation:f 4s ease-in-out infinite;transform-origin:center bottom;}
  @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;max-width:360px;}
  .sw{width:36px;height:36px;border-radius:11px;border:3px solid #fff;cursor:pointer;box-shadow:0 4px 9px rgba(120,60,100,.2);}
  .lbl{width:100%;text-align:center;font-weight:800;color:#e63d86;margin:6px 0 0;font-size:12px;}
</style>
</head>
<body>
  <h1>Semi-realistic — how far vector goes (free)</h1>
  <p class="sub">Soft shading, real eyes/lips/hair. Still recolors live. Tap chips.</p>
  <div class="row">
    <div class="card"><h2>Full figure</h2><div class="frame" id="figFrame"></div></div>
    <div class="card"><h2>Face close-up (where the realism lives)</h2><div class="frame" id="faceFrame"></div>
      <div class="lbl">Skin</div><div class="controls" id="skinCols"></div>
      <div class="lbl">Hair</div><div class="controls" id="hairCols"></div>
      <div class="lbl">Dress</div><div class="controls" id="dressCols"></div>
    </div>
  </div>
<script>
"use strict";
function shade(hex,a){let n=parseInt(hex.slice(1),16);let r=(n>>16&255)+a,g=(n>>8&255)+a,b=(n&255)+a;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const r=Math.round((a>>16&255)*(1-t)+(b>>16&255)*t),g=Math.round((a>>8&255)*(1-t)+(b>>8&255)*t),c=Math.round((a&255)*(1-t)+(b&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+c).toString(16).slice(1);}
let U=0;const id=p=>p+(++U);
const D={skin:'#f1c49c',hair:'#7b4a26',dress:'#d83a6e',lip:'#c84a64',eye:'#5b7a8c'};

/* ---- shared defs: builds gradients/filters for current colors ---- */
function defs(){
  const sk=D.skin, skHi=shade(sk,26), skMid=sk, skLo=shade(sk,-22), skSh=shade(sk,-40);
  const hc=D.hair, dr=D.dress, lip=D.lip, eye=D.eye;
  return {sk,skHi,skMid,skLo,skSh,hc,dr,lip,eye, svg:`
  <defs>
    <radialGradient id="GSK" cx=".4" cy=".34" r=".8"><stop offset="0" stop-color="${skHi}"/><stop offset=".55" stop-color="${skMid}"/><stop offset="1" stop-color="${skLo}"/></radialGradient>
    <linearGradient id="GSKlimb" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="${skHi}"/><stop offset=".6" stop-color="${skMid}"/><stop offset="1" stop-color="${skLo}"/></linearGradient>
    <radialGradient id="GIRIS" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="${shade(eye,55)}"/><stop offset=".5" stop-color="${eye}"/><stop offset="1" stop-color="${shade(eye,-45)}"/></radialGradient>
    <linearGradient id="GHAIR" x1=".15" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="${shade(hc,40)}"/><stop offset=".45" stop-color="${hc}"/><stop offset="1" stop-color="${shade(hc,-44)}"/></linearGradient>
    <linearGradient id="GHAIRsheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(hc,70)}" stop-opacity=".0"/><stop offset=".5" stop-color="${shade(hc,70)}" stop-opacity=".75"/><stop offset="1" stop-color="${shade(hc,70)}" stop-opacity="0"/></linearGradient>
    <linearGradient id="GDRESS" x1=".15" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="${shade(dr,36)}"/><stop offset=".55" stop-color="${dr}"/><stop offset="1" stop-color="${shade(dr,-30)}"/></linearGradient>
    <linearGradient id="GLIP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(lip,28)}"/><stop offset=".5" stop-color="${lip}"/><stop offset="1" stop-color="${shade(lip,-24)}"/></linearGradient>
    <radialGradient id="GBLUSH" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8fb0" stop-opacity=".55"/><stop offset="1" stop-color="#ff8fb0" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>`};
}

/* ===================== FACE (the realism centerpiece) =====================
   Drawn around head center (160,108). Reused at two scales. */
function faceLayers(C){
  const {sk,skHi,skLo,skSh,hc,lip}=C;
  return `
  <!-- head form: longer, narrower, defined chin -->
  <path d="M160 50 C126 50 114 80 116 106 C118 134 134 158 160 176 C186 158 202 134 204 106 C206 80 194 50 160 50Z" fill="url(#GSK)"/>
  <!-- ears -->
  <path d="M116 108 C107 106 105 122 115 128 C120 128 121 118 119 110Z" fill="url(#GSK)"/>
  <path d="M204 108 C213 106 215 122 205 128 C200 128 199 118 201 110Z" fill="url(#GSK)"/>
  <!-- soft contour shadows -->
  <g filter="url(#soft4)" opacity=".45">
    <path d="M122 116 C126 140 140 156 158 170 C150 152 138 138 130 116Z" fill="${skLo}"/>
    <path d="M198 116 C194 140 180 156 162 170 C170 152 182 138 190 116Z" fill="${skLo}"/>
    <ellipse cx="160" cy="156" rx="16" ry="9" fill="${skLo}"/>
  </g>
  <!-- cheekbone definition -->
  <path d="M126 124 C134 120 142 122 146 128" stroke="${skHi}" stroke-width="4" fill="none" opacity=".4" filter="url(#soft)"/>
  <path d="M194 124 C186 120 178 122 174 128" stroke="${skHi}" stroke-width="4" fill="none" opacity=".4" filter="url(#soft)"/>
  <!-- forehead highlight -->
  <ellipse cx="160" cy="78" rx="26" ry="14" fill="${skHi}" opacity=".45" filter="url(#soft4)"/>
  <!-- blush (lighter for maturity) -->
  <ellipse cx="134" cy="128" rx="11" ry="8" fill="url(#GBLUSH)" opacity=".7"/><ellipse cx="186" cy="128" rx="11" ry="8" fill="url(#GBLUSH)" opacity=".7"/>

  <!-- brows -->
  <g stroke="${shade(hc,-20)}" stroke-linecap="round" fill="none">
    <path d="M128 94 Q140 88 152 92" stroke-width="2.8"/><path d="M129 96 Q140 91 151 94" stroke-width="1.6" opacity=".6"/>
    <path d="M168 92 Q180 88 192 94" stroke-width="2.8"/><path d="M169 94 Q180 91 191 96" stroke-width="1.6" opacity=".6"/>
  </g>

  <!-- eyes (smaller, natural spacing) -->
  ${eye(141,110)} ${eye(179,110)}

  <!-- nose: slimmer -->
  <path d="M159 105 C158 116 156 124 154 129" stroke="${skHi}" stroke-width="2.4" fill="none" opacity=".5" stroke-linecap="round"/>
  <path d="M154 130 C157 134 163 134 166 130" stroke="${skSh}" stroke-width="1.8" fill="none" opacity=".5" stroke-linecap="round"/>
  <ellipse cx="160" cy="129" rx="4" ry="2.4" fill="${skHi}" opacity=".45"/>
  <ellipse cx="153" cy="131" rx="1.6" ry="1.1" fill="${skSh}" opacity=".4"/><ellipse cx="167" cy="131" rx="1.6" ry="1.1" fill="${skSh}" opacity=".4"/>

  <!-- lips: refined, less pillowy -->
  <path d="M157 137 Q160 134 163 137" stroke="${skSh}" stroke-width="1.3" fill="none" opacity=".35"/>
  <path d="M145 142 C150 139 156 140 160 141 C164 140 170 139 175 142 C170 145 164 146 160 146 C156 146 150 145 145 142Z" fill="url(#GLIP)"/>
  <path d="M145 142 C151 148 169 148 175 142 C169 151 151 151 145 142Z" fill="url(#GLIP)"/>
  <path d="M146 142 Q160 143.6 174 142" stroke="${shade(lip,-30)}" stroke-width="1.1" fill="none" opacity=".6"/>
  <ellipse cx="160" cy="147" rx="7" ry="1.8" fill="#fff" opacity=".35"/>
  <!-- chin highlight -->
  <ellipse cx="160" cy="162" rx="9" ry="5" fill="${skHi}" opacity=".35" filter="url(#soft)"/>
  `;
}
function eye(cx,cy){const lash='#2a2230';
  return `<g>
    <path d="M${cx-11} ${cy} C${cx-7} ${cy-6} ${cx+7} ${cy-6} ${cx+11} ${cy} C${cx+7} ${cy+5} ${cx-7} ${cy+5} ${cx-11} ${cy}Z" fill="#fbfdff"/>
    <clipPath id="ec${cx}"><path d="M${cx-11} ${cy} C${cx-7} ${cy-6} ${cx+7} ${cy-6} ${cx+11} ${cy} C${cx+7} ${cy+5} ${cx-7} ${cy+5} ${cx-11} ${cy}Z"/></clipPath>
    <g clip-path="url(#ec${cx})">
      <circle cx="${cx}" cy="${cy-0.5}" r="7" fill="url(#GIRIS)"/>
      <circle cx="${cx}" cy="${cy-0.5}" r="7" fill="none" stroke="${shade(D.eye,-55)}" stroke-width="1.1"/>
      <circle cx="${cx}" cy="${cy-0.5}" r="3.3" fill="#10131a"/>
      <circle cx="${cx+2.4}" cy="${cy-3}" r="1.8" fill="#fff"/><circle cx="${cx-2.4}" cy="${cy+1.5}" r="1" fill="#fff" opacity=".7"/>
    </g>
    <!-- upper lid + lashes -->
    <path d="M${cx-12} ${cy-0.5} C${cx-7} ${cy-7} ${cx+7} ${cy-7} ${cx+12} ${cy-1}" fill="none" stroke="${lash}" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M${cx+12} ${cy-1} l4 -2 M${cx+9} ${cy-5} l2 -3" stroke="${lash}" stroke-width="1.6" stroke-linecap="round"/>
    <!-- lid crease (adds maturity) -->
    <path d="M${cx-9} ${cy-3} C${cx-4} ${cy-6} ${cx+5} ${cy-6} ${cx+9} ${cy-4}" fill="none" stroke="${shade(D.skin,-30)}" stroke-width="1" opacity=".4"/>
    <!-- lower lash hint -->
    <path d="M${cx-10} ${cy+4} C${cx-5} ${cy+6} ${cx+6} ${cy+6} ${cx+10} ${cy+4}" fill="none" stroke="${lash}" stroke-width="0.9" opacity=".45"/>
    <!-- soft eyeshadow -->
    <path d="M${cx-12} ${cy-3} C${cx-7} ${cy-9} ${cx+7} ${cy-9} ${cx+12} ${cy-3}" fill="none" stroke="#c2a0be" stroke-width="2.4" opacity=".28" filter="url(#soft)"/>
  </g>`;
}

/* ===================== HAIR ===================== */
function hairBackL(){return `
  <path d="M108 96 C62 120 58 250 80 360 C88 408 104 452 120 470 C120 392 110 320 118 256 C112 196 124 150 134 116Z" fill="${shade(D.hair,-44)}"/>
  <path d="M212 96 C258 120 262 250 240 360 C232 408 216 452 200 470 C200 392 210 320 202 256 C208 196 196 150 186 116Z" fill="${shade(D.hair,-44)}"/>
  <path d="M114 92 C78 124 76 250 96 356 C102 396 112 440 126 460 L132 200 C146 168 174 168 188 200 L194 460 C208 440 218 396 224 356 C244 250 242 124 206 92Z" fill="url(#GHAIR)"/>`;}
function hairFrontL(){return `
  <path d="M110 108 C104 66 128 44 160 44 C192 44 216 66 210 108 C204 86 190 74 184 90 C172 64 160 96 160 96 C160 96 148 64 136 90 C130 74 116 86 110 108Z" fill="url(#GHAIR)"/>
  <!-- strand sheen -->
  <path d="M128 60 C152 48 184 56 198 86" stroke="url(#GHAIRsheen)" stroke-width="7" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M122 120 C112 220 112 330 126 430" stroke="${shade(D.hair,60)}" stroke-width="3" fill="none" opacity=".35"/>
  <path d="M198 120 C208 220 208 330 194 430" stroke="${shade(D.hair,60)}" stroke-width="3" fill="none" opacity=".35"/>
  <!-- flyaways -->
  <path d="M116 110 C108 130 110 150 118 168" stroke="${shade(D.hair,-20)}" stroke-width="2" fill="none" opacity=".5"/>
  <path d="M204 110 C212 130 210 150 202 168" stroke="${shade(D.hair,-20)}" stroke-width="2" fill="none" opacity=".5"/>`;}

/* ===================== FULL FIGURE ===================== */
function figure(){
  const C=defs();
  return `<svg viewBox="0 0 320 700" width="240">${C.svg}
    <ellipse cx="160" cy="684" rx="64" ry="12" fill="#5a3d52" opacity=".15"/>
    ${hairBackL()}
    <!-- legs (longer) -->
    <path d="M146 330 C141 440 141 560 146 632 C151 640 159 640 161 632 C163 560 161 440 161 330Z" fill="url(#GSKlimb)"/>
    <path d="M174 330 C179 440 179 560 174 632 C169 640 161 640 159 632 C157 560 159 440 159 330Z" fill="url(#GSKlimb)"/>
    <path d="M144 430 C142 500 144 570 150 626" stroke="${C.skSh}" stroke-width="3" fill="none" opacity=".22" filter="url(#soft)"/>
    <!-- heels -->
    <path d="M140 632 C138 644 144 652 158 652 L160 634Z" fill="${shade(D.dress,-26)}"/>
    <path d="M180 632 C182 644 176 652 162 652 L160 634Z" fill="${shade(D.dress,-26)}"/>
    <path d="M150 650 L140 666 L160 666 L160 650Z" fill="${D.dress}"/><path d="M170 650 L180 666 L160 666 L160 650Z" fill="${D.dress}"/>
    <!-- arms (slimmer) -->
    <path d="M134 208 C112 248 104 330 108 372 C115 378 122 374 124 366 C122 322 132 258 148 222Z" fill="url(#GSKlimb)"/>
    <path d="M186 208 C208 248 216 330 212 372 C205 378 198 374 196 366 C198 322 188 258 172 222Z" fill="url(#GSKlimb)"/>
    <ellipse cx="116" cy="378" rx="9" ry="12" fill="url(#GSK)"/><ellipse cx="204" cy="378" rx="9" ry="12" fill="url(#GSK)"/>
    <!-- gown (taller, slimmer hem) -->
    <path d="M134 206 C147 196 173 196 186 206 L190 320 L130 320Z" fill="url(#GDRESS)"/>
    <path d="M130 320 C120 420 104 530 92 656 C128 676 192 676 228 656 C216 530 200 420 190 320Z" fill="url(#GDRESS)"/>
    <path d="M160 210 L160 660" stroke="${shade(D.dress,40)}" stroke-width="3" opacity=".22"/>
    <path d="M138 336 C126 440 112 540 102 648" stroke="${shade(D.dress,-30)}" stroke-width="4" fill="none" opacity=".28" filter="url(#soft)"/>
    <path d="M182 336 C194 440 208 540 218 648" stroke="${shade(D.dress,-30)}" stroke-width="4" fill="none" opacity=".28" filter="url(#soft)"/>
    <path d="M92 656 C128 676 192 676 228 656" stroke="${shade(D.dress,40)}" stroke-width="4" fill="none" opacity=".45"/>
    <path d="M134 208 C147 222 173 222 186 208" stroke="${shade(D.dress,40)}" stroke-width="3" fill="none" opacity=".5"/>
    <!-- neck (longer) -->
    <path d="M150 168 C150 190 170 190 170 168 L170 150 L150 150Z" fill="url(#GSKlimb)"/>
    <ellipse cx="160" cy="192" rx="16" ry="5" fill="${C.skSh}" opacity=".4" filter="url(#soft)"/>
    ${faceLayers(C)}
    ${hairFrontL()}
    <circle cx="116" cy="126" r="2.6" fill="#ffd23f"/><circle cx="204" cy="126" r="2.6" fill="#ffd23f"/>
  </svg>`;
}
function faceClose(){
  const C=defs();
  return `<svg viewBox="96 40 128 150" width="250">${C.svg}
    ${hairBackL()}
    <path d="M150 168 C150 184 170 184 170 168 L170 152 L150 152Z" fill="url(#GSKlimb)"/>
    ${faceLayers(C)}
    ${hairFrontL()}
    <circle cx="116" cy="126" r="2.6" fill="#ffd23f"/><circle cx="204" cy="126" r="2.6" fill="#ffd23f"/>
  </svg>`;
}
function render(){
  document.getElementById('figFrame').innerHTML='<div class="float">'+figure()+'</div>';
  document.getElementById('faceFrame').innerHTML=faceClose();
}
render();
function chips(host,arr,key){const h=document.getElementById(host);h.innerHTML='';
  arr.forEach(c=>{const s=document.createElement('div');s.className='sw';s.style.background=c;s.onclick=()=>{D[key]=c;render();};h.appendChild(s);});}
chips('skinCols',['#fbe0c4','#f1c49c','#e0a878','#c68642','#8d5524','#5c3a21'],'skin');
chips('hairCols',['#1a1208','#7b4a26','#a9692e','#d6a300','#b03050','#6a3da0','#1a1a1a','#d8d8d8'],'hair');
chips('dressCols',['#d83a6e','#ff5fa2','#ffd23f','#37b89a','#7b6cd6','#3a8fd6','#ff7a3d','#3a2f44'],'dress');
</script>
</body>
</html>
